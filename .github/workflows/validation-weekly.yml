name: Weekly Validation
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: make test
      - run: make compile
      - run: |
          for file in scripts/*.sh; do
            case "$(head -1 "$file")" in
              *bash) bash -n "$file" ;;
              *) sh -n "$file" ;;
            esac
          done
      - run: |
          command -v curl
          python3 core/validation_report.py --period 60min --output /tmp/validation_report.json
