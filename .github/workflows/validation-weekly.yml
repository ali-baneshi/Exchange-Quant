name: Weekly Validation
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: make test
      - run: make lint
      - run: make compile
      - run: |
          for file in scripts/*; do
            case "$(head -1 "$file")" in
              *bash) bash -n "$file" ;;
              *) sh -n "$file" ;;
            esac
          done
      - run: python3 -m exchange_q power --mean-difference -0.01 --standard-deviation 0.05 --autocorrelation 0.3
