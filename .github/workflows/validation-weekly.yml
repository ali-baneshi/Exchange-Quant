name: Weekly Validation
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Verify dependencies
        run: python -m pip check
      - name: Run tests
        run: python -m pytest -q -ra --maxfail=1
        timeout-minutes: 5
      - name: Run lint
        run: python -m ruff check exchange_q tests
      - name: Compile sources
        run: python -m compileall exchange_q research
      - run: |
          for file in scripts/*; do
            case "$(head -1 "$file")" in
              *bash) bash -n "$file" ;;
              *) sh -n "$file" ;;
            esac
          done
      - run: python3 -m exchange_q power --mean-difference -0.01 --standard-deviation 0.05 --autocorrelation 0.3
